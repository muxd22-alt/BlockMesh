plugins {
    id 'com.android.application'
    id 'kotlin-android'
}

android {
    namespace 'com.muxd22.blockmesh'
    compileSdk 34

    defaultConfig {
        applicationId "com.muxd22.blockmesh"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }
    
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    
    // The AAR output from gomobile generated by GitHub Actions
    implementation files('../engine.aar')
}
