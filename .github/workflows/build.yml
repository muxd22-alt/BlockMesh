name: Build BlockMesh Pipelines

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-android:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: false

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Initialize Gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          gomobile init

      - name: Build Core Engine (AAR)
        run: |
          cd core-engine
          go get -tool golang.org/x/mobile/cmd/gobind
          go mod tidy
          gomobile bind -target=android -androidapi 24 -o ../client-android/engine.aar github.com/muxd22-alt/BlockMesh/core-engine

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Android APK
        run: |
          cd client-android
          gradle assembleDebug

      - name: Publish Direct Release (Continuous)
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: "continuous"
          name: "Latest Build"
          body: "Direct download of the BlockMesh APK. Continuously updated from the main branch."
          files: client-android/app/build/outputs/apk/debug/app-debug.apk
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-ios-core:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: false

      - name: Initialize Gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          gomobile init

      - name: Build iOS Core Framework (XCFramework)
        run: |
          cd core-engine
          go get -tool golang.org/x/mobile/cmd/gobind
          go mod tidy
          gomobile bind -target=ios -o ../client-ios/Engine.xcframework github.com/muxd22-alt/BlockMesh/core-engine

      - name: Upload iOS XCFramework Artifact
        uses: actions/upload-artifact@v4
        with:
          name: blockmesh-ios-xcframework
          path: client-ios/Engine.xcframework
